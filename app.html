<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Village Viver Bem — App</title>
<style>
  :root{
    --teal:#459B9A; --teal-esc:#2f6f6e; --grad1:#00A6B9; --grad2:#0AB287;
    --verde:#4CA585; --bg:#f4f7f7; --card:#ffffff; --txt:#243b3a; --muted:#7d9a99;
    --alerta:#e05a5a; --alerta-bg:#fdecec; --ok:#2f9e6f; --borda:#e4eded;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins','Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--txt);padding:0 0 50px;min-height:100vh}
  a{text-decoration:none;color:inherit}

  /* topo comum a todas as telas */
  .topo{color:#fff;padding:26px 20px 30px;border-radius:0 0 26px 26px;box-shadow:0 6px 20px rgba(0,0,0,.1)}
  .topo.grande{padding:30px 20px 34px;text-align:center}
  .voltar{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;opacity:.9;margin-bottom:14px;background:none;border:none;cursor:pointer;font-family:inherit}
  .topo h1{font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px}
  .topo.grande h1{justify-content:center}
  .topo p{font-size:13px;opacity:.92;margin-top:4px}
  .logo{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.9}
  .atualizado{font-size:11px;opacity:.9;margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;cursor:pointer;border:none;color:#fff;font-family:inherit}

  /* menu inicial (grade de setores) */
  .saudacao{padding:22px 18px 6px;font-size:15px;color:var(--teal-esc);font-weight:600}
  .saudacao span{color:var(--muted);font-weight:400;font-size:13px;display:block;margin-top:2px}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:14px 16px}
  .pasta{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:20px 16px;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.15s;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
  .pasta:active{transform:scale(.97)}
  .pasta .ico{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px}
  .pasta .nome{font-size:15.5px;font-weight:700}
  .pasta .desc{font-size:11.5px;color:var(--muted);line-height:1.4}
  .pasta .seta{position:absolute;top:16px;right:16px;color:var(--teal);font-size:16px;opacity:.5}
  .destaque{grid-column:1 / -1;background:linear-gradient(120deg,var(--teal),var(--verde));color:#fff;border:none}
  .destaque .desc{color:rgba(255,255,255,.9)}
  .destaque .ico{background:rgba(255,255,255,.2);color:#fff}
  .destaque .seta{color:#fff;opacity:.8}

  /* menus de setor (opções) */
  .instrucao{padding:22px 20px 4px;font-size:14px;color:var(--teal-esc);font-weight:600}
  .instrucao span{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:3px}
  .opcoes{padding:14px 16px;display:flex;flex-direction:column;gap:13px}
  .opcao{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:18px;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.15s;display:flex;align-items:center;gap:15px}
  .opcao:active{transform:scale(.98)}
  .opcao .ico{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
  .opcao .txt .nome{font-size:15.5px;font-weight:700}
  .opcao .txt .desc{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .opcao .seta{margin-left:auto;font-size:19px}
  .dica{background:#eef6f6;border:1px solid #d6e8e7;border-radius:14px;padding:14px 16px;margin:6px 16px;font-size:12.5px;color:var(--teal-esc);line-height:1.5}
  .dica b{color:var(--teal-esc)}

  /* estoque */
  .resumo{display:flex;gap:10px;padding:14px 14px 0}
  .rcard{flex:1;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px;text-align:center}
  .rcard .n{font-size:22px;font-weight:700;color:var(--teal)}
  .rcard.alerta .n{color:var(--alerta)}
  .rcard .l{font-size:10.5px;color:var(--muted);margin-top:2px}
  .abas{display:flex;gap:8px;padding:16px 14px 4px;position:sticky;top:0;background:var(--bg);z-index:5}
  .aba{flex:1;text-align:center;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--borda);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
  .aba.ativa{background:var(--teal);color:#fff;border-color:var(--teal)}
  .wrap{padding:6px 14px}
  .setor{margin-top:16px}
  .setor-titulo{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--teal-esc);margin:6px 4px 10px}
  .setor-titulo .qtd{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);background:#eaf3f2;padding:3px 9px;border-radius:20px}
  .item{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
  .item .nome{font-weight:600;font-size:14px}
  .item .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .item .estoque{margin-left:auto;text-align:right}
  .item .num{font-size:20px;font-weight:700;line-height:1}
  .item .un{font-size:11px;color:var(--muted)}
  .baixo .num{color:var(--alerta)}
  .tag-alerta{display:inline-block;background:var(--alerta-bg);color:var(--alerta);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px}
  .tag-ok{display:inline-block;background:#eaf7f0;color:var(--ok);font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-top:4px}
  .mov{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .mov .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .mov.entrada .ico{background:#eaf7f0}
  .mov.saida .ico{background:var(--alerta-bg)}
  .mov .info .t{font-weight:600;font-size:13.5px}
  .mov .info .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .mov .val{margin-left:auto;font-weight:700;font-size:15px}
  .mov.entrada .val{color:var(--ok)}
  .mov.saida .val{color:var(--alerta)}
  .oculto{display:none}

  /* moradores */
  .acao{padding:16px 16px 4px}
  .btn-add{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:16px 18px;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .btn-add .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;background:#e8f4f4;color:var(--teal-esc)}
  .btn-add .nome{font-size:15px;font-weight:700}
  .btn-add .desc{font-size:11.5px;color:var(--muted);margin-top:2px}
  .btn-add .seta{margin-left:auto;color:var(--teal);font-size:19px}
  .morador{background:var(--card);border:1px solid var(--borda);border-radius:15px;padding:15px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.03)}
  .morador .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0}
  .morador .nome{font-size:15px;font-weight:600}
  .morador .quarto{font-size:12px;color:var(--muted);margin-top:2px}
  .btn-scan{flex-shrink:0;background:var(--teal);color:#fff;font-size:11.5px;font-weight:600;padding:9px 13px;border-radius:20px;white-space:nowrap}
  .btn-scan:active{transform:scale(.96)}
  .chip-opcoes{display:flex;flex-wrap:wrap;gap:9px}
  .chip{padding:10px 16px;border-radius:20px;border:1px solid var(--borda);background:#fff;font-size:13.5px;font-weight:600;color:var(--txt);cursor:pointer}
  .chip.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
  .chip.chip-full{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.45;margin-bottom:8px}
  .chip.chip-full::before{content:'☐';font-size:17px;flex-shrink:0;line-height:1.3}
  .chip.chip-full.sel::before{content:'☑';color:#fff}
  .chip-full-texto{flex:1}
  .katz-pts{margin-left:8px;flex-shrink:0;font-weight:800;font-size:14px;background:#eef2f2;color:var(--muted);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .chip.chip-full.sel .katz-pts{background:rgba(255,255,255,.28);color:#fff}
  .pin-btn{aspect-ratio:1;border-radius:16px;border:1px solid var(--borda);background:#fff;font-size:22px;font-weight:700;color:var(--txt)}
  .pin-btn:active{background:var(--teal);color:#fff}

  .estado{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px}
  .spin{width:34px;height:34px;border:3px solid #dbe9e8;border-top-color:var(--teal);border-radius:50%;margin:0 auto 14px;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .rodape{text-align:center;font-size:11px;color:var(--muted);margin-top:26px;padding:0 20px}

  /* ---- layout com barra lateral ---- */
  body{padding:0}
  .layout{display:flex;min-height:100vh}
  #sidebar{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--borda);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-logo{padding:0 18px 16px;font-weight:700;color:var(--teal-esc);font-size:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--borda);margin-bottom:10px;padding-bottom:16px}
  .sb-link{display:flex;align-items:center;gap:11px;padding:11px 18px;color:var(--txt);font-size:13.5px;font-weight:600;border-left:3px solid transparent}
  .sb-link .ico{font-size:17px;width:20px;text-align:center;flex-shrink:0}
  .sb-link:active{background:#f4f7f7}
  .sb-link.ativo{background:var(--cor-bg,#e8f4f4);color:var(--teal-esc);border-left-color:var(--teal)}
  .sb-badge{margin-left:auto;background:#c0392b;color:#fff;font-size:10.5px;font-weight:700;line-height:1;padding:3px 6px;border-radius:20px;display:none}
  .sb-badge.mostrar{display:inline-block}
  .sb-sep{margin:10px 18px;border-top:1px solid var(--borda)}
  .sb-sub{display:flex;align-items:center;gap:9px;padding:8px 18px 8px 40px;color:var(--muted);font-size:12.5px;font-weight:600;border-left:3px solid transparent}
  .sb-sub .ico{font-size:14px;width:16px;text-align:center;flex-shrink:0}
  .sb-sub:active{background:#f4f7f7}
  .sb-sub.ativo{background:var(--cor-bg,#e8f4f4);color:var(--teal-esc);border-left-color:var(--teal)}
  #main-content{flex:1;min-width:0}
  #hamburger{display:none;position:fixed;top:14px;left:14px;z-index:40;width:42px;height:42px;border-radius:12px;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:19px;align-items:center;justify-content:center}
  #sb-overlay{display:none}
  @media (max-width:820px){
    #hamburger{display:flex}
    #sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:4px 0 20px rgba(0,0,0,.15)}
    .layout.sb-aberta #sidebar{transform:translateX(0)}
    .layout.sb-aberta #sb-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  }
</style>
</head>
<body>
<div class="layout" id="layout">
  <button id="hamburger" onclick="toggleSidebar()">☰</button>
  <div id="sb-overlay" onclick="toggleSidebar(false)"></div>
  <nav id="sidebar">
    <div class="sb-logo">🌳 Village Viver Bem</div>
    <a class="sb-link" data-hash="inicio" href="#inicio"><span class="ico">🏠</span>Início</a>
    <a class="sb-link" id="sb-painel" href="#"><span class="ico">📊</span>Visão Geral</a>
    <a class="sb-link" data-hash="farmacia" href="#farmacia"><span class="ico">💊</span>Farmácia<span class="sb-badge" id="bd-farmacia"></span></a>
    <a class="sb-sub" data-hash="leitor-farmacia" href="#leitor-farmacia"><span class="ico">📷</span>Leitor rápido</a>
    <a class="sb-sub" data-hash="medicamentos" id="sb-medicamentos" href="#"><span class="ico">💊</span>Medicamentos</a>
    <a class="sb-link" data-hash="cozinha" href="#cozinha"><span class="ico">🍳</span>Cozinha<span class="sb-badge" id="bd-cozinha"></span></a>
    <a class="sb-sub" data-hash="leitor-cozinha" href="#leitor-cozinha"><span class="ico">📷</span>Leitor rápido</a>
    <a class="sb-link" data-hash="lavanderia" href="#lavanderia"><span class="ico">🧺</span>Rouparia &amp; Lavanderia<span class="sb-badge" id="bd-lavanderia"></span></a>
    <a class="sb-sub" data-hash="leitor-lavanderia" href="#leitor-lavanderia"><span class="ico">📷</span>Leitor rápido</a>
    <a class="sb-link" data-hash="secretaria" href="#secretaria"><span class="ico">📋</span>Secretaria<span class="sb-badge" id="bd-secretaria"></span></a>
    <a class="sb-sub" data-hash="leitor-secretaria" href="#leitor-secretaria"><span class="ico">📷</span>Leitor rápido</a>
    <a class="sb-link" data-hash="enfermagem" href="#enfermagem"><span class="ico">🩺</span>Enfermagem<span class="sb-badge" id="bd-enfermagem"></span></a>
    <a class="sb-sub" data-hash="leitor-enfermagem" href="#leitor-enfermagem"><span class="ico">📷</span>Leitor rápido</a>
    <div class="sb-sep"></div>
    <a class="sb-link" data-hash="moradores" href="#moradores"><span class="ico">🧑‍🦳</span>Moradores<span class="sb-badge" id="bd-moradores"></span></a>
    <a class="sb-link" data-hash="intercorrencias" href="#intercorrencias"><span class="ico">🚨</span>Intercorrências<span class="sb-badge" id="bd-intercorrencias"></span></a>
    <a class="sb-link" data-hash="funcionarios" href="#funcionarios"><span class="ico">🧑‍⚕️</span>Equipe</a>
    <a class="sb-link" data-hash="estoque" href="#estoque"><span class="ico">📊</span>Ver Estoque Geral</a>
    <div class="sb-sep"></div>
    <a class="sb-link" id="sb-financeiro" href="#"><span class="ico">💰</span>Financeiro (DRE)</a>
  </nav>
  <div id="main-content">
    <div id="app"></div>
  </div>
</div>

<script>
  // ==== Configuração do Supabase (compartilhada por todo o app) ====
  const SUPABASE_URL = 'https://ilssyjyabxgtwwodbzpz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_eyYyLvibu5i4bZMAzcDTCg_Hn2Oea6j';

  // ==== Links dos formulários n8n (compartilhados por todos os setores) ====
  const FORM_MOVIMENTACAO = 'https://eduardonoronha9.app.n8n.cloud/form/1f25fe1e-e6dd-4b9a-aa30-9a6313cf085e';
  const FORM_CADASTRO_PRODUTO = 'https://eduardonoronha9.app.n8n.cloud/form/5c0cf483-dcfb-4a6e-8a00-eacde4067546';

  // ==== App financeiro (DRE, folha, contas a pagar etc.) — sistema próprio, hospedado à parte ====
  const APP_FINANCEIRO = 'https://villageviverbem-cloud.github.io/Village-Financeiro/';
  const PAINEL_URL = 'painel.html';
  // Painéis reais de estoque do n8n que o Leitor manda direto (sem passar pelas
  // tabelas produtos/movimentacoes deste app) — mesmo espírito da integração com
  // o Prontuário: usa o "contrato" (campos de URL) que cada painel já espera.
  const FARMACIA_INSUMOS_URL = 'https://eduardonoronha9.app.n8n.cloud/webhook/estoque-insumos';
  const COZINHA_PAINEL_URL = 'https://eduardonoronha9.app.n8n.cloud/webhook/estoque-cozinha-painel';
  const LAVANDERIA_PAINEL_URL = 'https://eduardonoronha9.app.n8n.cloud/webhook/lavanderia-painel';
  // Farmácia-Medicamentos foi removida do Leitor: é dado clínico por residente e exige
  // Dose/Unidade batendo exatamente com o que já está prescrito, senão cria registro
  // fantasma duplicado (aconteceu em teste real). Fica só na tela real mesmo.
  const FARMACIA_MEDICAMENTOS_URL = 'https://eduardonoronha9.app.n8n.cloud/webhook/farmacia-medicamentos';
  const SETORES_INTEGRADOS = ['farmacia', 'cozinha', 'lavanderia'];
  function voltarParaIlpi(){
    // O Portal do n8n andou instável e deixando essa navegação em branco —
    // como quase tudo já foi migrado pro nosso app, "Voltar" volta pro
    // Início daqui em vez de sair pro Portal externo.
    location.hash = 'inicio';
  }

  // ---------- BARRA LATERAL ----------
  document.getElementById('sb-financeiro').addEventListener('click', function(e){ e.preventDefault(); irExterno('financeiro', APP_FINANCEIRO); });
  document.getElementById('sb-painel').addEventListener('click', function(e){ e.preventDefault(); irExterno('painel', PAINEL_URL); });
  document.getElementById('sb-medicamentos').addEventListener('click', function(e){ e.preventDefault(); location.hash = 'moradores'; });
  function toggleSidebar(forcar){
    const layout = document.getElementById('layout');
    const abrir = forcar !== undefined ? forcar : !layout.classList.contains('sb-aberta');
    layout.classList.toggle('sb-aberta', abrir);
  }
  document.querySelectorAll('#sidebar [data-hash]').forEach(a=>{
    a.addEventListener('click', ()=> toggleSidebar(false));
  });
  function atualizarSidebarAtiva(hashAtual){
    let grupo = hashAtual;
    if(hashAtual.indexOf('leitor-') === 0){ /* mantém o hash completo, casa com o sub-item */ }
    else if(hashAtual.indexOf('morador') === 0 || ['registrar-agua-','registrar-fralda-','registrar-higiene-','registrar-decubito-','registrar-curativo-','registrar-evacuacao-','registrar-diurese-','registrar-mobilidade-','registrar-pele-','registrar-comportamento-','registrar-dor-','registrar-alimentacao-','registrar-intercorrencia-','anotacao-','vitais-','evolucao-','katz-','editar-katz-','lawton-','editar-lawton-','sae-','plano-','medicacoes-','administrar-','relatorio-','nova-prescricao-'].some(p=>hashAtual.indexOf(p)===0)) grupo = 'moradores';
    else if(hashAtual.indexOf('funcionarios') === 0) grupo = 'funcionarios';
    document.querySelectorAll('#sidebar [data-hash]').forEach(a=>{
      a.classList.toggle('ativo', a.dataset.hash === grupo);
    });
  }

  function setBadge(id, n){
    const el = document.getElementById(id);
    if(!el) return;
    el.textContent = n > 99 ? '99+' : String(n);
    el.classList.toggle('mostrar', n > 0);
  }

  async function atualizarBadgesSidebar(){
    try{
      const dataSP = iso => { try{ return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}); }catch(_e){ return ''; } };
      const hojeSP = new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
      const norm2 = s => String(s||'').trim().toLowerCase();
      const setNaoAberta = ['resolvida','resolvido','fechada','fechado','concluida','concluída'];
      const [produtos, intercTodas, sinaisRecentes, prescricoesAtivas, admRecente] = await Promise.all([
        api('produtos?select=setor,estoque_atual,estoque_minimo'),
        api('intercorrencias?select=status').catch(()=>[]),
        api('sinais_vitais?select=morador_id,alertas,data_hora&order=data_hora.desc&limit=2000').catch(()=>[]),
        api('prescricoes?select=morador_id,medicamento,horario&ativo=eq.true').catch(()=>[]),
        api('administracao_medicamentos?select=morador_id,medicamento,horario_previsto,status,data_hora&order=data_hora.desc&limit=500').catch(()=>[])
      ]);

      const baixoPorSetor = {};
      produtos.forEach(p=>{
        const s = norm2(p.setor);
        const est = Number(p.estoque_atual)||0, min = Number(p.estoque_minimo)||0;
        if(min>0 && est<=min) baixoPorSetor[s] = (baixoPorSetor[s]||0) + 1;
      });

      const admHoje = admRecente.filter(a => dataSP(a.data_hora) === hojeSP);
      const medAdministrado = (medName, moradorId, horario) => admHoje.some(a => a.morador_id === moradorId && norm2(a.medicamento) === norm2(medName) && norm2(a.horario_previsto) === norm2(horario) && norm2(a.status).indexOf('adminis') >= 0);
      const moradoresComPendencia = new Set();
      prescricoesAtivas.forEach(p=>{
        if(!medAdministrado(p.medicamento, p.morador_id, p.horario)) moradoresComPendencia.add(p.morador_id);
      });

      const intercAbertas = intercTodas.filter(r => setNaoAberta.indexOf(norm2(r.status)) === -1).length;

      const seteDiasAtras = Date.now() - 7*86400000;
      // Conta moradores cujo ÚLTIMO sinal (nos últimos 7 dias) tem alerta
      const ultimoSinalBadge = {};
      sinaisRecentes.forEach(s=>{
        const t = new Date(s.data_hora).getTime();
        if(t < seteDiasAtras) return;
        if(!ultimoSinalBadge[s.morador_id] || t > ultimoSinalBadge[s.morador_id].t){
          ultimoSinalBadge[s.morador_id] = { t, tem: !!(s.alertas && String(s.alertas).trim()) };
        }
      });
      const sinaisAlerta = Object.keys(ultimoSinalBadge).filter(mid => ultimoSinalBadge[mid].tem).length;

      setBadge('bd-farmacia', (baixoPorSetor.farmacia||0) + moradoresComPendencia.size);
      setBadge('bd-cozinha', baixoPorSetor.cozinha||0);
      setBadge('bd-lavanderia', baixoPorSetor.lavanderia||0);
      setBadge('bd-secretaria', baixoPorSetor.secretaria||0);
      setBadge('bd-enfermagem', baixoPorSetor.enfermagem||0);
      setBadge('bd-moradores', sinaisAlerta);
      setBadge('bd-intercorrencias', intercAbertas);
    }catch(_e){ /* sininho é best-effort — se falhar, só não mostra, não trava o app */ }
  }

  function norm(s){ return (s||'').toString().trim().toLowerCase(); }
  function cap(s){ s=(s||'').trim(); return s.charAt(0).toUpperCase()+s.slice(1); }
  function esc(s){
    return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function iniciais(nome){
    const p = (nome||'').trim().split(/\s+/);

    return ((p[0][0]||'') + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
  }
  async function api(caminho){
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + caminho, {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    });
    if(!r.ok) throw new Error('Erro ' + r.status);
    return r.json();
  }
  async function apiWrite(caminho, method, body){
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + caminho, {
      method,
      headers: {
        apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal'
      },
      body: JSON.stringify(body)
    });
    if(!r.ok){
      let detalhe = '';
      try{
        const texto = await r.text();
        try{
          const d = JSON.parse(texto);
          detalhe = d.message || d.hint || d.details || d.code || texto;
        }catch(_eJson){
          detalhe = texto;
        }
      }catch(_e){}
      detalhe = (detalhe || '').toString().slice(0, 200);
      throw new Error('Erro ' + r.status + ' ao gravar' + (detalhe ? ' — ' + detalhe : ''));
    }
  }

    const token = viewToken;

      const baixo = produtos.filter(p => norm(p.setor) === chave && Number(p.estoque_minimo)>0 && Number(p.estoque_atual)<=Number(p.estoque_minimo));

    if(chave === 'farmacia') carregarPendenciasFarmacia(token);

  async function carregarPendenciasFarmacia(token){
    try{
      const hojeSP = new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
      const dataSP = iso => { try{ return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}); }catch(_e){ return ''; } };
      const [prescricoes, adm] = await Promise.all([
        api('prescricoes?select=morador_id,morador_nome,medicamento,horario&ativo=eq.true').catch(()=>[]),
        api('administracao_medicamentos?select=morador_id,medicamento,horario_previsto,status,data_hora&order=data_hora.desc&limit=500').catch(()=>[])
      ]);
      if(token !== viewToken) return;
      const admHoje = adm.filter(a => dataSP(a.data_hora) === hojeSP);
      const foiDado = (med, mid, horario) => admHoje.some(a => a.morador_id === mid && norm(a.medicamento) === norm(med) && norm(a.horario_previsto) === norm(horario) && norm(a.status).indexOf('adminis') >= 0);
      const pendentes = {};
      prescricoes.forEach(p=>{
        if(!foiDado(p.medicamento, p.morador_id, p.horario)){
          if(!pendentes[p.morador_id]) pendentes[p.morador_id] = {nome:p.morador_nome, meds:[]};
          pendentes[p.morador_id].meds.push(p.medicamento);
        }
      });
      const lista = Object.keys(pendentes).map(id => ({id, nome:pendentes[id].nome, meds:pendentes[id].meds}));
      const area = document.getElementById('setor-alerta-area');
      if(!area || !lista.length) return;
      const linhas = lista.map(m => `<a class="opcao" href="#medicacoes-${esc(m.id)}" style="border:2px solid #b8860b;background:#fff8e6">
        <div class="ico" style="background:#fff;color:#b8860b">💊</div>
        <div class="txt"><div class="nome">${esc(m.nome||'Morador')}</div><div class="desc">Pendente hoje: ${esc(m.meds.join(', '))}</div></div>
        <div class="seta" style="color:#b8860b">→</div>
      </a>`).join('');
      area.insertAdjacentHTML('beforeend', `<div style="margin-bottom:2px;padding:10px 14px;background:#fff8e6;border:2px solid #b8860b;border-radius:12px;font-size:13px;color:#8a6000;font-weight:700">💊 ${lista.length} morador(es) com medicação pendente hoje — toque para abrir a ficha</div>${linhas}`);
    }catch(_e){ /* pendências é best-effort */ }
  }

  // Mantém o campo de leitura em foco (o leitor USB "digita" nele) mesmo se o usuário tocar na tela —
  // mas só enquanto o formulário ainda não abriu. Depois que abre, o toque é pra preencher os campos
  // (nome, lote, validade...), então não pode roubar o foco de volta, senão trava a digitação neles.
  // Registrado uma única vez, fora de telaLeitor, pra não empilhar um listener novo a cada visita.
  document.addEventListener('click', (e)=>{
    if(e.target.closest('input, select, textarea, button, a, label')) return;
    const formEl = document.getElementById('leitor-form');
    if(formEl && !formEl.classList.contains('oculto')) return;
    const i = document.getElementById('scan-input');

  async function handleScan(codigo, setorChave){
    const token = viewToken;
    const estado = document.getElementById('leitor-estado');
    const formEl = document.getElementById('leitor-form');
    formEl.classList.add('oculto');
    estado.classList.remove('oculto');
    estado.innerHTML = '<div class="spin"></div>Procurando "'+esc(codigo)+'"...';
    try{
      // Busca só pelo código de barras (sem filtrar setor): o banco só permite um produto
      // por código de barras no total, então tem que achar antes de tentar cadastrar de novo,
      // senão dá erro de duplicidade.
      const existentes = await api('produtos?select=*&codigo_barras=eq.'+encodeURIComponent(codigo));
      if(token !== viewToken) return;
      const produto = existentes[0] || null;
      let nomeSugerido = '';
      if(!produto){
        try{
          const r = await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(codigo)+'.json');
          const d = await r.json();
          if(token !== viewToken) return;
          if(d && d.status === 1 && d.product){
            nomeSugerido = (d.product.product_name || d.product.product_name_pt || '').toString().trim();
          }
        }catch(_e){ /* busca externa é best-effort — segue sem nome sugerido se falhar */ }
      }
      if(token !== viewToken) return;
      mostrarFormularioLeitor(codigo, setorChave, produto, nomeSugerido);
    }catch(e){
      if(token !== viewToken) return;
      estado.innerHTML = '⚠️ Não consegui consultar o estoque.<br><small>('+esc(e.message)+')</small>';
    }
  }

  function mostrarFormularioLeitor(codigo, setorChave, produto, nomeSugerido){
    const s = estiloLeitor(setorChave);

      ${mostrarUnidade ? `<label style="font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px">Unidade (ex: un, cx, kg)</label>
      <input id="f-unidade" type="text" value="${esc(unidade)}" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;margin-bottom:12px;font-size:14px">` : ''}
      ${mostrarLote ? `<label style="font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px">Lote</label>

  async function salvarMovimentoLeitor(codigo, setorChave, produtoId){
    if(leitorSalvando) return;
    const msg = document.getElementById('f-msg');
    const nome = document.getElementById('f-nome').value.trim();
    const qtd = Number(document.getElementById('f-qtd').value) || 0;
    const tipo = window.__tipoMov || 'entrada';
    if(!nome || qtd <= 0){ msg.textContent = 'Preencha nome e uma quantidade válida.'; return; }

    // Todos os setores agora gravam direto nas tabelas do próprio app (Supabase), sem n8n.
    const unidadeEl = document.getElementById('f-unidade');
    const loteEl = document.getElementById('f-lote');
    const validadeEl = document.getElementById('f-validade');
    const unidade = unidadeEl && unidadeEl.value.trim() ? unidadeEl.value.trim() : 'un';
    const lote = loteEl && loteEl.value.trim() ? loteEl.value.trim() : null;
    const validade = validadeEl && validadeEl.value ? validadeEl.value : null;
    const residente = document.getElementById('f-morador') ? (document.getElementById('f-morador').value || null) : null;
    leitorSalvando = true;
    const btn = document.getElementById('f-salvar');
    if(btn) btn.disabled = true;
    msg.textContent = 'Salvando...';
    try{
      const delta = tipo === 'entrada' ? qtd : -qtd;
      let idAlvo = produtoId;
      if(idAlvo === null || idAlvo === undefined){
        // Confere de novo bem na hora de salvar (não só quando escaneou) — evita cadastrar
        // duplicado se o produto já foi criado nesse meio tempo (código de barras é único).
        const achados = await api('produtos?select=id&codigo_barras=eq.'+encodeURIComponent(codigo));
        if(achados[0]) idAlvo = achados[0].id;
      }
      if(idAlvo !== null && idAlvo !== undefined){
        const atuais = await api('produtos?select=*&id=eq.'+encodeURIComponent(idAlvo));
        const produto = atuais[0];
        const novoEstoque = (Number(produto.estoque_atual)||0) + delta;
        await apiWrite('produtos?id=eq.'+encodeURIComponent(idAlvo), 'PATCH', {estoque_atual: novoEstoque, nome, unidade});
      }else{
        try{
          await apiWrite('produtos', 'POST', {
            nome, unidade, setor: setorChave, codigo_barras: codigo,
            estoque_atual: delta, estoque_minimo: 0
          });
        }catch(erroPost){
          // Se ainda assim bateu de novo numa duplicidade (corrida entre duas leituras ao
          // mesmo tempo, por exemplo), busca o que já existe e atualiza em vez de falhar.
          if(!/codigo_barras/i.test(erroPost.message)) throw erroPost;
          const achados2 = await api('produtos?select=*&codigo_barras=eq.'+encodeURIComponent(codigo));
          const existente = achados2[0];
          if(!existente) throw erroPost;
          const novoEstoque = (Number(existente.estoque_atual)||0) + delta;
          await apiWrite('produtos?id=eq.'+encodeURIComponent(existente.id), 'PATCH', {estoque_atual: novoEstoque, nome, unidade});
        }
      }
      await apiWrite('movimentacoes', 'POST', {
        tipo, produto_nome: nome, codigo_barras: codigo, setor: setorChave,
        quantidade: qtd, validade, lote, residente, data_hora: new Date().toISOString()
      });
      document.getElementById('leitor-form').classList.add('oculto');
      const estado = document.getElementById('leitor-estado');
      estado.classList.remove('oculto');
      estado.innerHTML = '✅ Movimentação registrada. Escaneie o próximo produto.';
      const input = document.getElementById('scan-input');
      if(input){ input.value=''; input.focus(); }
    }catch(e){
      msg.textContent = '⚠️ Erro ao salvar: ' + esc(e.message) + '. Me avisa que eu ajusto.';
    }finally{
      leitorSalvando = false;
      if(btn) btn.disabled = false;
    }
  }

    const token = viewToken;

    try{
      const [produtos, movs] = await Promise.all([
        api('produtos?select=*&order=setor,nome'),

  function renderEstoque(produtos){
    const el = document.getElementById('tela-estoque');
    if(!produtos.length){ el.innerHTML = '<div class="estado">Nenhum produto cadastrado ainda.</div>'; return; }
    let baixoTotal = 0;
    const grupos = {};
    produtos.forEach(p=>{
      const s = norm(p.setor) || 'outros';
      (grupos[s] = grupos[s] || []).push(p);
    });
    let html = '';
    const ordem = ['cozinha','farmacia','lavanderia','secretaria','enfermagem'];
    const chaves = [...ordem.filter(k=>grupos[k]), ...Object.keys(grupos).filter(k=>!ordem.includes(k))];
    chaves.forEach(sKey=>{
      const info = SETORES_ESTOQUE[sKey] || {icone:'📦', nome:cap(sKey)};
      const itens = grupos[sKey];
      html += `<div class="setor"><div class="setor-titulo">${info.icone} ${esc(info.nome)} <span class="qtd">${itens.length} ${itens.length===1?'item':'itens'}</span></div>`;
      itens.forEach(p=>{
        const est = Number(p.estoque_atual)||0;
        const min = Number(p.estoque_minimo)||0;
        const baixo = min>0 && est<=min;
        if(baixo) baixoTotal++;
        const un = esc((p.unidade||'un').toString().trim());
        html += `<div class="item ${baixo?'baixo':''}">
          <div>
            <div class="nome">${esc((p.nome||'—').toString().trim())}</div>
            <div class="sub">${un}${min>0?' · mín. '+min:''}</div>
            ${baixo?'<span class="tag-alerta">⚠ estoque baixo</span>':'<span class="tag-ok">estoque ok</span>'}
          </div>
          <div class="estoque"><div class="num">${est}</div><div class="un">${un}${est===1?'':'s'}</div></div>
        </div>`;
      });
      html += `</div>`;
    });
    el.innerHTML = html;
    document.getElementById('r-itens').textContent = produtos.length;
    document.getElementById('r-baixo').textContent = baixoTotal;
  }

  function renderMov(movs){
    const el = document.getElementById('tela-mov');
    if(!movs.length){ el.innerHTML = '<div class="estado">Nenhuma movimentação registrada ainda.</div>'; return; }
    let html = '';
    movs.forEach(m=>{
      const ent = norm(m.tipo)==='entrada';
      const d = m.data_hora ? new Date(m.data_hora) : null;
      const dstr = d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
      const setor = m.setor ? esc(cap(m.setor)) : '';
      const resid = m.residente ? ' · Residente '+esc(String(m.residente).trim()) : '';
      html += `<div class="mov ${ent?'entrada':'saida'}">
        <div class="ico">${ent?'📥':'📤'}</div>
        <div class="info">
          <div class="t">${esc((m.produto_nome||m.codigo_barras||'Movimentação').toString().trim())}${setor?' · '+setor:''}</div>
          <div class="d">${dstr}${resid}</div>
        </div>
        <div class="val">${ent?'+':'−'}${Number(m.quantidade)||0}</div>
      </div>`;
    });
    el.innerHTML = html;
  }

  window.carregarMoradores = async function(){
    const token = viewToken;
    document.getElementById('quando').textContent = 'Atualizando...';
    try{
      const dataSP2 = iso => { try{ return new Date(iso).getTime(); }catch(_e){ return 0; } };
      const seteDias = Date.now() - 7*86400000;
      const [moradores, sinaisAlerta] = await Promise.all([
        api('moradores?select=*&order=nome'),
        api('sinais_vitais?select=morador_id,alertas,data_hora&order=data_hora.desc&limit=2000').catch(()=>[])
      ]);
      if(token !== viewToken) return;
      // Alerta vale o ÚLTIMO sinal vital de cada morador: se a medição mais recente
      // (nos últimos 7 dias) tem alerta, marca; se a última já está normal, não marca.
      const ultimoSinal = {};
      sinaisAlerta.forEach(s=>{
        const t = dataSP2(s.data_hora);
        if(t < seteDias) return;
        if(!ultimoSinal[s.morador_id] || t > ultimoSinal[s.morador_id].t){
          ultimoSinal[s.morador_id] = { t, alertas: (s.alertas && String(s.alertas).trim()) ? String(s.alertas).trim() : '' };
        }
      });
      const alertaPorMorador = {};
      Object.keys(ultimoSinal).forEach(mid=>{
        if(ultimoSinal[mid].alertas) alertaPorMorador[mid] = ultimoSinal[mid].alertas;
      });
      const el = document.getElementById('lista');
      document.getElementById('contador').textContent = moradores.length + (moradores.length===1?' morador':' moradores');
      const souAdmin = !!(funcionarioAtual() && funcionarioAtual().admin);
      if(!moradores.length){
        el.innerHTML = '<div class="estado">Nenhum morador cadastrado ainda.<br>Toque em "Cadastrar novo morador" acima.</div>';
      }else{
        let html = '';
        moradores.forEach(m=>{
          const nome = (m.nome||'—').toString().trim();
          const quarto = m.quarto ? ('Quarto ' + esc(String(m.quarto).trim())) : 'Sem quarto';
          const arquivado = m.ativo === false;
          const temAlerta = alertaPorMorador[m.id];
          const acoesAdmin = souAdmin ? `
            <a href="#morador-editar-${esc(m.id)}" class="js-morador-editar" data-id="${esc(m.id)}" data-stop="1" style="padding:8px 8px;color:var(--muted)" title="Editar">✏️</a>
            <a href="#" class="js-morador-arquivar" data-id="${esc(m.id)}" data-ativo="${arquivado?'0':'1'}" data-nome="${esc(nome)}" data-stop="1" style="padding:8px 8px;color:var(--muted)" title="${arquivado?'Reativar':'Arquivar'}">${arquivado?'♻️':'🗄️'}</a>
            <a href="#" class="js-morador-excluir" data-id="${esc(m.id)}" data-nome="${esc(nome)}" data-stop="1" style="padding:8px 8px;color:#c0392b" title="Excluir permanentemente">🗑️</a>
          ` : '';
          html += `<div class="morador js-morador" data-id="${esc(m.id)}" style="cursor:pointer${arquivado?';opacity:.55':''}${temAlerta?';border:2px solid #e05a5a;background:#fff6f6':''}">
            <div class="av"${temAlerta?' style="background:linear-gradient(135deg,#e05a5a,#c0392b)"':''}>${esc(iniciais(nome))}</div>
            <div style="flex:1"><div class="nome">${esc(nome)}${arquivado?' <span style="font-size:10.5px;color:var(--muted);font-weight:700">· ARQUIVADO</span>':''}</div>
              <div class="quarto">🚪 ${quarto}</div>
              ${temAlerta?`<div style="font-size:11.5px;color:#c0392b;font-weight:700;margin-top:3px">🔴 Alerta: ${esc(temAlerta)}</div>
              <a href="#vitais-${esc(m.id)}" data-stop="1" style="display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;color:#fff;background:#2f9e6f;padding:5px 11px;border-radius:16px;text-decoration:none">✓ Registrar nova medição</a>`:''}
            </div>
            <a class="btn-scan" href="#leitor-farmacia" data-stop="1">📷 Ler código</a>
            ${acoesAdmin}
          </div>`;
        });
        el.innerHTML = html;
        moradorNomeCache = {};
        moradores.forEach(m=>{ moradorNomeCache[m.id] = m.nome; });
        el.querySelectorAll('.js-morador').forEach(div=>{
          tornarClicavel(div, ()=>{ location.hash = 'morador-' + div.dataset.id; });
        });
        el.querySelectorAll('[data-stop]').forEach(a=>{
          a.addEventListener('click', e=>e.stopPropagation());
        });
        el.querySelectorAll('.js-morador-arquivar').forEach(a=>{
          a.addEventListener('click', e=>{ e.preventDefault(); arquivarMorador(a.dataset.id, a.dataset.ativo === '1', a.dataset.nome); });
        });
        el.querySelectorAll('.js-morador-excluir').forEach(a=>{
          a.addEventListener('click', e=>{ e.preventDefault(); excluirMorador(a.dataset.id, a.dataset.nome); });
        });
      }
      const agora = new Date();
      document.getElementById('quando').textContent = 'Atualizado ' + agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }catch(e){
      if(token !== viewToken) return;
      document.getElementById('lista').innerHTML = '<div class="estado">⚠️ Não consegui carregar os moradores.<br><small>('+esc(e.message)+')</small></div>';
      document.getElementById('quando').textContent = 'Erro ao carregar';
    }
  };

  async function arquivarMorador(id, estaAtivo, nome){
    const acao = estaAtivo ? 'arquivar' : 'reativar';
    if(!confirm((estaAtivo ? 'Arquivar' : 'Reativar') + ' "' + nome + '"?' + (estaAtivo ? ' Ele deixa de aparecer nas listas principais, mas o histórico dele é mantido.' : ''))) return;
    try{
      await apiWrite('moradores?id=eq.'+encodeURIComponent(id), 'PATCH', {ativo: !estaAtivo});
      carregarMoradores();
    }catch(e){
      alert('⚠️ Não consegui ' + acao + ': ' + e.message);
    }

  async function sha256Hex(texto){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  // ---------- ACESSO POR CARGO ----------
  // Cada cargo só acessa o próprio setor (+ Moradores, que fica liberado pra
  // qualquer funcionário logado). "gestao" e admin da Equipe acessam tudo.
  const ACESSO_SETOR = {
    farmacia: ['farmacia', 'enfermagem', 'gestao'],
    cozinha: ['cozinha', 'gestao'],
    lavanderia: ['lavanderia', 'gestao'],
    secretaria: ['secretaria', 'gestao'],
    enfermagem: ['enfermagem', 'gestao'],
    financeiro: ['gestao']
  };
  function temAcessoSetor(chave){
    const f = funcionarioAtual();
    if(!f) return false;
    if(f.admin) return true;
    const permitidos = ACESSO_SETOR[chave];
    if(!permitidos) return true;
    const papeis = f.papeis || [];
    return papeis.some(function(p){ return permitidos.indexOf(p) !== -1; });
  }
  function telaSemAcesso(chave, f){
    const nomeSetor = (SETORES[chave] && SETORES[chave].nome) || (chave === 'financeiro' ? 'Financeiro' : chave);
    app.innerHTML = `
      <div class="topo" style="background:linear-gradient(120deg,#c0392b,#922b21)">

      </div>
    `;
  }
  function garantirAcessoSetor(chave){
    const f = funcionarioAtual();
    if(!f){
      location.hash = 'funcionarios?v=' + encodeURIComponent(chave);
      return false;
    }
    if(!temAcessoSetor(chave)){
      telaSemAcesso(chave, f);
      return false;
    }
    return true;
  }
  // Pra continuar pro link externo certo depois de logar (ver 'externo-' no roteador).
  const EXTERNOS = { farmacia: FARMACIA_MEDICAMENTOS_URL, financeiro: APP_FINANCEIRO };
  // Pra links externos (Financeiro, Farmácia-Medicamentos) que não passam pelo
  // roteador de hash do app — mesma checagem, mas navega pra fora se liberado.
  function irExterno(chave, url){

    if(!f){

    app.innerHTML = `

      irPara('funcionarios' + (pinVoltarHash ? '?v='+encodeURIComponent(pinVoltarHash) : ''));
    });
    document.querySelectorAll('.pin-btn').forEach(b=>{
      b.addEventListener('click', ()=>pinTecla(b.dataset.n));
    });
  }

  function atualizarPinDots(){
    const el = document.getElementById('pin-dots');
    if(!el) return;
    el.textContent = '●'.repeat(pinDigitado.length) + '○'.repeat(4 - pinDigitado.length);
  }

  function pinTecla(t){
    if(t === 'apagar'){ pinDigitado = pinDigitado.slice(0,-1); atualizarPinDots(); return; }
    if(pinDigitado.length >= 4) return;
    pinDigitado += t;
    atualizarPinDots();
    if(pinDigitado.length === 4) confirmarPin();
  }

  async function confirmarPin(){
    const sessao = pinSessao;
    const token = viewToken;
    const alvo = pinAlvo;
    const voltar = pinVoltarHash;
    const msg = document.getElementById('pin-msg');
    msg.textContent = 'Verificando...';
    try{
      const hash = await sha256Hex(pinDigitado);
      const rows = await api('funcionarios?select=id,nome,pin_hash,admin,papeis&id=eq.'+encodeURIComponent(alvo.id));
      if(sessao !== pinSessao || token !== viewToken) return;
      const f = rows[0];
      if(f && f.pin_hash === hash){
        setFuncionarioAtual({id: f.id, nome: f.nome, admin: !!f.admin, papeis: (f.papeis && f.papeis.length) ? f.papeis : ['cuidadora']});
        irPara(voltar || 'funcionarios');
      }else{
        msg.textContent = 'PIN incorreto, tenta de novo.';
        pinDigitado = '';
        atualizarPinDots();
      }
    }catch(e){
      if(sessao !== pinSessao || token !== viewToken) return;
      msg.textContent = 'Erro: ' + esc(e.message);
      pinDigitado = '';
      atualizarPinDots();
    }
  }

    const msg = document.getElementById('fe-msg');
    const nome = document.getElementById('fe-nome').value.trim();
    const cargo = document.getElementById('fe-cargo').value.trim();
    const admin = document.getElementById('fe-admin').checked;
    const ativo = document.getElementById('fe-ativo').checked;
    const papeis = lerPapeisMarcados('fe');
    const pin = document.getElementById('fe-pin').value.trim();
    if(!nome){ msg.textContent = 'Preencha o nome.'; return; }

    if(pin && !/^\d{4}$/.test(pin)){ msg.textContent = 'O PIN novo precisa ter exatamente 4 números (ou deixe em branco pra manter o atual).'; return; }
    msg.textContent = 'Salvando...';

      if(pin){ corpo.pin_hash = await sha256Hex(pin); }
      await apiWrite('funcionarios?id=eq.'+encodeURIComponent(id), 'PATCH', corpo);

    const msg = document.getElementById('fe-msg');

    try{

  async function gerarRelatorioMorador(moradorId, deYMD, ateYMD){
    const msg = document.getElementById('rm-msg');
    if(msg) msg.textContent = 'Gerando relatório...';
    try{
      // Início do dia "de" e fim do dia "até", no fuso de São Paulo
      const iniMs = new Date(deYMD + 'T00:00:00-03:00').getTime();
      const fimMs = new Date(ateYMD + 'T23:59:59-03:00').getTime();
      const noPeriodo = iso => { try{ const t = new Date(iso).getTime(); return t >= iniMs && t <= fimMs; }catch(_e){ return false; } };
      const fmtD = iso => { try{ return new Date(iso).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}); }catch(_e){ return String(iso||''); } };
      const v = x => (x===null||x===undefined||x==='') ? '—' : x;
      const [mrows, sinais, katz, lawton, interc, evol, cuidados] = await Promise.all([
        api('moradores?select=*&id=eq.'+encodeURIComponent(moradorId)),
        api('sinais_vitais?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=500').catch(()=>[]),
        api('avaliacoes_katz?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=50').catch(()=>[]),
        api('avaliacoes_lawton?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=50').catch(()=>[]),
        api('intercorrencias?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=200').catch(()=>[]),
        api('evolucoes_diarias?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=200').catch(()=>[]),
        api('registros_cuidado?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=1000').catch(()=>[])
      ]);
      const m = mrows[0] || {nome:'—'};
      const sF = sinais.filter(r=>noPeriodo(r.data_hora));
      const kF = katz.filter(r=>noPeriodo(r.data_hora));
      const lF = lawton.filter(r=>noPeriodo(r.data_hora));
      const iF = interc.filter(r=>noPeriodo(r.data_hora));
      const eF = evol.filter(r=>noPeriodo(r.data_hora));
      const cF = cuidados.filter(r=>noPeriodo(r.data_hora)).sort((a,b)=>new Date(a.data_hora)-new Date(b.data_hora));

      // nomes amigáveis dos tipos de cuidado
      const nomesTipo = {agua:'💧 Hidratação',fralda:'🧷 Fralda',alimentacao:'🍽️ Alimentação',higiene:'🛁 Higiene/Banho',decubito:'🔄 Mudança de decúbito',curativo:'🩹 Curativo',evacuacao:'🚽 Evacuação',diurese:'💛 Diurese',mobilidade:'🚶 Mobilidade',pele:'🧴 Pele',comportamento:'🧠 Comportamento',dor:'😖 Dor',anotacao:'📝 Anotação'};
      const nomeTipo = t => nomesTipo[t] || ('• '+esc(t||'—'));

      const sinaisHtml = sF.length ? `<table><tr><th>Quando</th><th>PA</th><th>Temp</th><th>SatO2</th><th>Glic</th><th>FC</th><th>Alertas</th></tr>${sF.map(s=>`<tr><td>${fmtD(s.data_hora)}</td><td>${v(s.pa_sistolica)}/${v(s.pa_diastolica)}</td><td>${v(s.temperatura)}</td><td>${v(s.sato2)}</td><td>${v(s.glicemia)}</td><td>${v(s.freq_cardiaca)}</td><td>${s.alertas?('⚠️ '+esc(s.alertas)):'—'}</td></tr>`).join('')}</table>` : '<p class="vazio">Nenhum registro no período.</p>';
      const cuidadosHtml = cF.length ? `<table><tr><th>Hora</th><th>Cuidado</th><th>Registro</th><th>Obs.</th><th>Por</th></tr>${cF.map(c=>`<tr><td>${fmtD(c.data_hora)}</td><td>${nomeTipo(c.tipo)}</td><td>${esc(c.valor||'—')}</td><td>${esc(c.observacao||'—')}</td><td>${esc(c.funcionario_nome||'—')}</td></tr>`).join('')}</table>` : '<p class="vazio">Nenhum registro de cuidado no período.</p>';
      const evolHtml = eF.length ? eF.map(e=>`<div class="reg"><b>${fmtD(e.data_hora)}</b>${e.turno?(' · '+esc(e.turno)):''}${e.funcionario_nome?(' — '+esc(e.funcionario_nome)):''}<br>${esc(e.texto||e.evolucao||e.observacao||e.descricao||'')}</div>`).join('') : '<p class="vazio">Nenhuma evolução no período.</p>';
      const intercHtml = iF.length ? iF.map(i=>`<div class="reg"><b>${fmtD(i.data_hora)}</b> — ${esc(i.tipo||'—')} (${esc(i.gravidade||'—')})<br>${esc(i.descricao||i.observacao||'')}</div>`).join('') : '<p class="vazio">Nenhuma intercorrência no período.</p>';
      const avalHtml = (kF.length||lF.length) ? `${kF.map(k=>`<div class="reg"><b>${fmtD(k.data_hora)}</b> — Escala de Katz: escore ${v(k.escore_total)}/6</div>`).join('')}${lF.map(l=>`<div class="reg"><b>${fmtD(l.data_hora)}</b> — Escala de Lawton: escore ${v(l.escore_total)}</div>`).join('')}` : '<p class="vazio">Nenhuma avaliação no período.</p>';

      const agora = new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
      const periodoTxt = (deYMD===ateYMD)
        ? ('Dia ' + new Date(deYMD+'T12:00:00').toLocaleDateString('pt-BR'))
        : ('De ' + new Date(deYMD+'T12:00:00').toLocaleDateString('pt-BR') + ' até ' + new Date(ateYMD+'T12:00:00').toLocaleDateString('pt-BR'));
      const win = window.open('', '_blank');
      win.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório — ${esc(m.nome)}</title>
        <style>
          body{font-family:'Segoe UI',system-ui,sans-serif;color:#243b3a;padding:28px;max-width:840px;margin:0 auto}
          h1{font-size:21px;color:#2f6f6e;border-bottom:3px solid #0AB287;padding-bottom:8px;margin-bottom:4px}
          h2{font-size:15px;color:#2f6f6e;margin:22px 0 8px;border-left:4px solid #0AB287;padding-left:8px}
          .cab{font-size:12px;color:#7d9a99;margin-bottom:8px}
          table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
          th,td{border:1px solid #e4eded;padding:6px 8px;text-align:left;vertical-align:top}
          th{background:#f2f8f8;color:#2f6f6e}
          .reg{border:1px solid #e4eded;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.5}
          .vazio{color:#8a99a8;font-size:12.5px;font-style:italic}
          .aviso{font-size:11px;color:#8a99a8;margin-top:24px;border-top:1px solid #e4eded;padding-top:12px}
          .btn-print{background:#0AB287;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:18px}
          @media print{ .btn-print{display:none} }
        </style></head><body>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
        <h1>📋 Relatório do Residente</h1>
        <div class="cab"><b>${esc(m.nome)}</b>${m.quarto?(' · Quarto '+esc(m.quarto)):''} · ${periodoTxt} · Gerado em ${agora}</div>
        <h2>❤️ Sinais Vitais (${sF.length})</h2>${sinaisHtml}
        <h2>🧾 Cuidados Diários (${cF.length})</h2>${cuidadosHtml}
        <h2>📔 Evoluções (${eF.length})</h2>${evolHtml}
        <h2>🚨 Intercorrências (${iF.length})</h2>${intercHtml}
        <h2>📋 Avaliações (${kF.length+lF.length})</h2>${avalHtml}
        <div class="aviso">Documento de apoio organizacional gerado pelo sistema Village Viver Bem. Não substitui os registros clínicos oficiais exigidos pela vigilância sanitária.</div>
        </body></html>`);
      win.document.close();
      if(msg) msg.textContent = 'Relatório aberto em nova aba. Use o botão Imprimir / Salvar PDF.';
    }catch(e){
      if(msg){ msg.style.color='#c0392b'; msg.textContent = 'Erro ao gerar: '+e.message; }
    }
  }

  async function salvarNovaPrescricao(moradorId){
    const msg = document.getElementById('np-msg');
    const med = document.getElementById('np-med').value.trim();
    const dose = document.getElementById('np-dose').value.trim();
    const forma = document.getElementById('np-forma').value;
    const qtd = Number(document.getElementById('np-qtd').value) || 1;
    const horario = document.getElementById('np-horario').value.trim();
    const via = document.getElementById('np-via').value.trim();
    if(!med){ msg.textContent = 'Preencha o medicamento.'; return; }
    const f = funcionarioAtual();
    if(!f){ location.hash = 'funcionarios?v=' + encodeURIComponent('nova-prescricao-'+moradorId); return; }
    const btn = document.getElementById('np-salvar');
    if(btn) btn.disabled = true;
    msg.textContent = 'Salvando...';
    try{
      const nome = await nomeDoMorador(moradorId);
      await apiWrite('prescricoes', 'POST', {
        morador_id: moradorId, morador_nome: nome, medicamento: med,
        dose: dose || null, forma: forma, quantidade: String(qtd),
        via: via || null, horario: horario || null, ativo: true
      });
      location.hash = 'medicacoes-' + moradorId;
    }catch(e){
      msg.textContent = '⚠️ Erro: ' + esc(e.message) + '.';
      if(btn) btn.disabled = false;

  async function carregarMedicacoes(moradorId){
    const token = viewToken;
    const el = document.getElementById('med-area');
    try{
      const [prescricoes, admRecente] = await Promise.all([
        api('prescricoes?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&ativo=eq.true&order=medicamento'),
        api('administracao_medicamentos?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=200')
      ]);
      if(token !== viewToken) return;
      if(!prescricoes.length){
        el.innerHTML = '<div class="estado">Nenhuma prescrição ativa cadastrada pra esse morador.</div>';
        return;
      }
      const norm = s => String(s||'').trim().toLowerCase();
      const dataSP = iso => { try{ return new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}); }catch(_e){ return ''; } };
      const hojeSP = new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
      const admHoje = admRecente.filter(a => dataSP(a.data_hora) === hojeSP);
      el.innerHTML = prescricoes.map(p=>{
        const doHoje = admHoje.filter(a => norm(a.medicamento) === norm(p.medicamento) && norm(a.horario_previsto) === norm(p.horario));
        const dado = doHoje.some(a => norm(a.status).indexOf('adminis') >= 0);
        const badge = dado
          ? '<span style="font-size:11px;font-weight:700;color:#1e8449;background:#eaf7f0;padding:4px 10px;border-radius:20px;white-space:nowrap">✅ Dado hoje'+(doHoje.length>1?' x'+doHoje.length:'')+'</span>'
          : '<span style="font-size:11px;font-weight:700;color:#c0392b;background:#fdecec;padding:4px 10px;border-radius:20px;white-space:nowrap">⏳ Pendente</span>';
        return `<div class="morador js-med" data-id="${esc(p.id)}" style="cursor:pointer">
          <div class="av">💊</div>
          <div style="flex:1">
            <div class="nome">${esc(p.medicamento)}</div>
            <div class="quarto">${esc(p.dose||'')}${p.via?' · '+esc(p.via):''}${p.horario?' · '+esc(p.horario):''}${(Number(p.quantidade)>0)?' · '+esc(p.quantidade)+' '+esc(p.forma||'un'):''}</div>
          </div>
          ${badge}
        </div>`;
      }).join('');
      el.querySelectorAll('.js-med').forEach(div=>{
        tornarClicavel(div, ()=>{ location.hash = 'administrar-' + div.dataset.id; });
      });
    }catch(e){
      if(token !== viewToken) return;
      el.innerHTML = '⚠️ Não consegui carregar. <br><small>('+esc(e.message)+')</small>';
    }
  }

  async function salvarAdministrarMedicamento(p){
    const msg = document.getElementById('am-msg');
    if(!administrarStatus){ msg.textContent = 'Escolha uma opção.'; return; }
    const f = funcionarioAtual();
    if(!f){ location.hash = 'funcionarios?v=' + encodeURIComponent('administrar-'+p.id); return; }
    const obs = document.getElementById('am-obs').value.trim();
    msg.textContent = 'Salvando...';
    const btn = document.getElementById('am-salvar');
    if(btn) btn.disabled = true;
    try{
      await apiWrite('administracao_medicamentos', 'POST', {
        morador_id: p.morador_id, morador_nome: p.morador_nome, medicamento: p.medicamento,
        dose: p.dose, via: p.via, horario_previsto: p.horario, status: administrarStatus,
        administrado_por: f.nome, observacao: obs || null, data_hora: new Date().toISOString()
      });
      // Se foi ADMINISTRADO, desconta do estoque da farmácia do morador (medicacao_morador)
      if(String(administrarStatus).toLowerCase().indexOf('adminis') >= 0){
        try{
          const qtdBaixa = Number(p.quantidade) > 0 ? Number(p.quantidade) : 1;
          const nomeMorador = (p.morador_nome||'').trim();
          const nomeRemedio = (p.medicamento||'').trim();
          // busca no estoque da farmácia por morador + remédio (case-insensitive)
          const est = await api('medicacao_morador?select=*'
            + '&morador=ilike.' + encodeURIComponent(nomeMorador)
            + '&remedio=ilike.' + encodeURIComponent(nomeRemedio));
          if(est && est.length){
            const item = est[0];
            let nova = (Number(item.quantidade)||0) - qtdBaixa;
            if(nova < 0) nova = 0;
            await apiWrite('medicacao_morador?id=eq.'+item.id, 'PATCH', { quantidade: nova, atualizado_em: new Date().toISOString() });
          }
          // se não achou no estoque, não trava — a checagem já foi registrada
        }catch(_e){ /* desconto é best-effort, não bloqueia a checagem */ }
      }
      location.hash = 'medicacoes-' + p.morador_id;
    }catch(e){
      msg.textContent = '⚠️ Erro: ' + esc(e.message) + '.';
      if(btn) btn.disabled = false;
    }
  }

  async function carregarIntercorrencias(){
    const token = viewToken;
    const el = document.getElementById('ic-lista');
    try{
      const lista = await api('intercorrencias?select=*&order=data_hora.desc&limit=200');
      if(token !== viewToken) return;
      if(!lista.length){ el.innerHTML = '<div class="estado">Nenhuma intercorrência registrada ainda.</div>'; return; }
      const aberta = s => { const x = String(s||'').trim().toLowerCase(); return ['resolvida','resolvido','fechada','fechado','concluida','concluída'].indexOf(x) === -1; };
      const ordenada = lista.slice().sort((a,b) => (aberta(b.status)?1:0) - (aberta(a.status)?1:0) || new Date(b.data_hora) - new Date(a.data_hora));
      const corGravidade = { grave: '#c0392b', moderada: '#c9a227', leve: '#2f9e6f' };
      el.innerHTML = ordenada.map(r=>{
        const g = String(r.gravidade||'').toLowerCase();
        const cor = corGravidade[g] || 'var(--muted)';
        const d = r.data_hora ? new Date(r.data_hora) : null;
        const dstr = d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
        const estaAberta = aberta(r.status);
        const botao = estaAberta ? `<a href="#" class="js-ic-resolver" data-id="${esc(r.id)}" data-stop="1" style="padding:8px 10px;color:#1e8449;white-space:nowrap" title="Marcar resolvida">✅ Resolver</a>` : '';
        return `<div class="morador" style="align-items:flex-start${estaAberta?'':';opacity:.6'}">
          <div class="av" style="background:${cor}22;color:${cor}">🚨</div>
          <div style="flex:1">
            <div class="nome">${esc(r.morador_nome||'—')} <span style="font-size:10.5px;font-weight:700;color:${cor}">· ${esc(r.gravidade||'—')}</span></div>
            <div class="quarto">${esc(r.tipo||'')}${r.local?' · '+esc(r.local):''} · ${dstr}</div>
            <div class="quarto" style="margin-top:3px">${esc(r.descricao||'')}</div>
            <div class="quarto" style="margin-top:3px;font-style:italic">Status: ${esc(r.status||'aberta')}${r.reportado_por?' · Por: '+esc(r.reportado_por):''}</div>
          </div>
          ${botao}
        </div>`;
      }).join('');
      el.querySelectorAll('.js-ic-resolver').forEach(a=>{
        a.addEventListener('click', e=>{ e.preventDefault(); resolverIntercorrencia(a.dataset.id); });
      });
    }catch(e){
      if(token !== viewToken) return;
      el.innerHTML = '⚠️ Não consegui carregar. <br><small>('+esc(e.message)+')</small>';
    }
  }

  async function resolverIntercorrencia(id){
    if(!confirm('Marcar essa intercorrência como resolvida?')) return;
    try{

      carregarIntercorrencias();
    }catch(e){
      alert('⚠️ Não consegui marcar como resolvida: ' + e.message);

  }

      const regs = regsResult.status === 'fulfilled' ? regsResult.value : [];
      const katz = katzResult.status === 'fulfilled' ? katzResult.value : [];
      const vitais = vitaisResult.status === 'fulfilled' ? vitaisResult.value : [];

      const lawton = lawtonResult.status === 'fulfilled' ? lawtonResult.value : [];
      const sae = saeResult.status === 'fulfilled' ? saeResult.value : [];

      const el = document.getElementById('mf-historico');

      const itens = [
        ...regs.map(r => ({tipo: r.tipo, valor: r.valor, quem: r.funcionario_nome, data_hora: r.data_hora})),

  function calcularAlertasVitais(v){
    const alertas = [];
    if(v.pa_sistolica !== null && (v.pa_sistolica > 140 || v.pa_sistolica < 90)) alertas.push('PA sistólica');
    if(v.pa_diastolica !== null && (v.pa_diastolica > 90 || v.pa_diastolica < 60)) alertas.push('PA diastólica');
    if(v.temperatura !== null && (v.temperatura > 37.8 || v.temperatura < 35)) alertas.push('Temperatura');
    if(v.sato2 !== null && (v.sato2 < 92 || v.sato2 > 100)) alertas.push('Saturação fora do normal');
    if(v.glicemia !== null && (v.glicemia > 180 || v.glicemia < 70)) alertas.push('Glicemia');
    if(v.freq_cardiaca !== null && (v.freq_cardiaca > 100 || v.freq_cardiaca < 60)) alertas.push('Freq. cardíaca');
    if(v.freq_respiratoria !== null && (v.freq_respiratoria > 24 || v.freq_respiratoria < 12)) alertas.push('Freq. respiratória');
    if(v.dor !== null && v.dor >= 7) alertas.push('Dor alta');
    return alertas.join(', ') || null;
  }

      freq_respiratoria: num('vt-fr'), peso: num('vt-peso'),
      dor: getDor() !== null ? Number(getDor()) : null, nivel_consciencia: getConsciencia()
    };
    const algumPreenchido = Object.values(dados).some(v => v !== null && v !== undefined);
    if(!algumPreenchido){ msg.textContent = 'Preencha ao menos um valor.'; return; }
    msg.textContent = 'Salvando...';

  async function carregarUltimoKatz(moradorId){
    const token = viewToken;

    try{
      const rows = await api('avaliacoes_katz?select=*&morador_id=eq.'+encodeURIComponent(moradorId)+'&order=data_hora.desc&limit=1');

      if(!rows.length){

        return;
      }
      const r = rows[0];
      katzEditandoId = r.id;
      KATZ_ITENS.forEach(it => {

        if(valor === null || valor === undefined) return;

        if(cont){

        <textarea id="sae-queixa" rows="2" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px"></textarea>
        <label style="font-size:12.5px;color:var(--muted);display:block;margin:12px 0 4px">Alergias</label>
        <input id="sae-alergias" type="text" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px">
        <label style="font-size:12.5px;color:var(--muted);display:block;margin:12px 0 4px">Medicação em uso</label>
        <textarea id="sae-medicacao" rows="2" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px"></textarea>
        <div style="display:flex;gap:10px;margin:14px 0 4px">
          <div style="flex:1"><label style="font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px">PA</label><input id="sae-pa" type="text" placeholder="Ex.: 120x80" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px"></div>
          <div style="flex:1"><label style="font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px">HGT</label><input id="sae-hgt" type="text" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px"></div>
          <div style="flex:1"><label style="font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px">Temp. (°C)</label><input id="sae-temp" type="text" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px"></div>
        </div>
        ${SAE_SECOES.map(sec => `
          <div style="font-size:15px;font-weight:700;color:var(--teal-esc);margin:18px 0 8px">${esc(sec.titulo)}</div>
          <div class="chip-opcoes" id="sae-${sec.chave}">
            ${sec.opcoes.map(o=>`<div class="chip" data-valor="${esc(o)}">${esc(o)}</div>`).join('')}
          </div>
        `).join('')}
        <label style="font-size:12.5px;color:var(--muted);display:block;margin:14px 0 4px">Observações</label>
        <textarea id="sae-obs" rows="3" style="width:100%;border:1px solid var(--borda);border-radius:10px;padding:11px;font-size:14px"></textarea>
        <button id="sae-salvar" style="width:100%;background:#1a6b4a;color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;margin-top:14px">💾 Salvar consulta</button>
        <div id="sae-msg" style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px"></div>
      </div>
    `;
    document.getElementById('btn-voltar-morador').addEventListener('click', () => { location.hash = 'morador-' + moradorId; });
    let etilista = null, tabagista = null;
    ligarChips('sae-etilista', v => etilista = v);
    ligarChips('sae-tabagista', v => tabagista = v);
    SAE_SECOES.forEach(sec => ligarMultiToggle('sae-' + sec.chave, sec.chave));
    document.getElementById('sae-salvar').addEventListener('click', () => salvarSAE(moradorId, () => etilista, () => tabagista));
  }

  async function salvarSAE(moradorId, getEtilista, getTabagista){
    const msg = document.getElementById('sae-msg');
    const f = funcionarioAtual();
    if(!f){ location.hash = 'funcionarios?v=' + encodeURIComponent('sae-'+moradorId); return; }
    const val = id => { const v = document.getElementById(id).value.trim(); return v || null; };
    msg.textContent = 'Salvando...';
    const btn = document.getElementById('sae-salvar');
    if(btn) btn.disabled = true;
    try{
      const moradorNome = await nomeDoMorador(moradorId);
      await apiWrite('consultas_enfermagem', 'POST', {
        morador_id: moradorId, morador_nome: moradorNome, enfermeiro: f.nome,
        prontuario: val('sae-prontuario'), leito: val('sae-leito'), dia_internacao: val('sae-dia'),
        etilista: getEtilista(), tabagista: getTabagista(),
        queixa_principal: val('sae-queixa'), alergias: val('sae-alergias'), medicacao_uso: val('sae-medicacao'),
        pa: val('sae-pa'), hgt: val('sae-hgt'), temperatura: val('sae-temp'),
        respostas: saeRespostas, observacoes: val('sae-obs'),
        data_hora: new Date().toISOString()
      });
      location.hash = 'morador-' + moradorId;
    }catch(e){
      msg.textContent = '⚠️ Erro: ' + esc(e.message) + '. Se a tabela "consultas_enfermagem" não existe, rode o SQL que te mandei.';
      if(btn) btn.disabled = false;
    }
  }

  // ---------- PLANO TERAPÊUTICO SEMANAL ----------
  const PLANO_DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const PLANO_PERIODOS = ['Manhã','Tarde','Noite'];
  let planoCelulas = {}; // 'Dia|Periodo' -> {id, atividade, feito}

  function telaPlanoTerapeutico(moradorId){
    const hashAtual = 'plano-' + moradorId;
    if(!exigirFuncionario(hashAtual)) return;
    app.innerHTML = `
      <div class="topo" style="background:linear-gradient(120deg,#9070c0,#7a5fb0)">
        <button class="voltar" id="btn-voltar-morador">← Voltar</button>
        <h1>🧭 Plano Terapêutico Semanal</h1>
        <p>Atividade de cada período + marcar quando for feito</p>
      </div>
      ${bannerFuncionario(hashAtual)}
      <div id="plano-area" class="wrap"><div class="estado"><div class="spin"></div>Carregando...</div></div>
    `;
    document.getElementById('btn-voltar-morador').addEventListener('click', () => { location.hash = 'morador-' + moradorId; });
    carregarPlanoTerapeutico(moradorId);
  }

  async function carregarPlanoTerapeutico(moradorId){
    const token = viewToken;
    const el = document.getElementById('plano-area');
    try{
      const rows = await api('plano_terapeutico?select=*&morador_id=eq.'+encodeURIComponent(moradorId));
      if(token !== viewToken) return;
      planoCelulas = {};
      PLANO_DIAS.forEach(dia => {
        PLANO_PERIODOS.forEach(periodo => {
          const existente = rows.find(r => r.dia_semana === dia && r.periodo === periodo);
          planoCelulas[dia+'|'+periodo] = existente
            ? {id: existente.id, atividade: existente.atividade || '', feito: !!existente.feito}
            : {id: null, atividade: '', feito: false};
        });
      });
      el.innerHTML = `
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:640px">
            <tr>
              <th style="text-align:left;padding:8px;font-size:12px;color:var(--muted)"></th>
              ${PLANO_PERIODOS.map(p=>`<th style="text-align:left;padding:8px;font-size:12px;color:var(--muted)">${p}</th>`).join('')}
            </tr>
            ${PLANO_DIAS.map(dia => `
              <tr>
                <td style="padding:8px;font-size:12.5px;font-weight:700;color:var(--teal-esc);white-space:nowrap;vertical-align:top">${dia}</td>
                ${PLANO_PERIODOS.map(periodo => {
                  const c = planoCelulas[dia+'|'+periodo];
                  const chave = dia+'|'+periodo;
                  return `<td style="padding:6px;vertical-align:top">
                    <input type="text" class="pl-atividade" data-chave="${esc(chave)}" value="${esc(c.atividade)}" placeholder="Atividade" style="width:100%;border:1px solid var(--borda);border-radius:8px;padding:7px;font-size:12.5px;margin-bottom:4px">
                    <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)">
                      <input type="checkbox" class="pl-feito" data-chave="${esc(chave)}" ${c.feito?'checked':''} style="width:15px;height:15px"> Feito
                    </label>
                  </td>`;
                }).join('')}
              </tr>
            `).join('')}
          </table>
        </div>
        <button id="plano-salvar" style="width:100%;background:#7a5fb0;color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;margin-top:16px">💾 Salvar plano</button>
        <div id="plano-msg" style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px"></div>
      `;
      el.querySelectorAll('.pl-atividade').forEach(inp=>{
        inp.addEventListener('input', ()=>{ planoCelulas[inp.dataset.chave].atividade = inp.value; });
      });
      el.querySelectorAll('.pl-feito').forEach(chk=>{
        chk.addEventListener('change', ()=>{ planoCelulas[chk.dataset.chave].feito = chk.checked; });
      });
      document.getElementById('plano-salvar').addEventListener('click', () => salvarPlanoTerapeutico(moradorId));
    }catch(e){
      if(token !== viewToken) return;
      el.innerHTML = '⚠️ Não consegui carregar. <br><small>('+esc(e.message)+')</small> Se a tabela "plano_terapeutico" não existe, rode o SQL que te mandei.';
    }
  }

  async function salvarPlanoTerapeutico(moradorId){
    const msg = document.getElementById('plano-msg');
    const f = funcionarioAtual();
    if(!f){ location.hash = 'funcionarios?v=' + encodeURIComponent('plano-'+moradorId); return; }
    msg.textContent = 'Salvando...';
    const btn = document.getElementById('plano-salvar');
    if(btn) btn.disabled = true;
    try{
      const moradorNome = await nomeDoMorador(moradorId);
      const agora = new Date().toISOString();
      const chaves = Object.keys(planoCelulas);
      for(const chave of chaves){
        const c = planoCelulas[chave];
        const [dia, periodo] = chave.split('|');
        if(c.id){
          await apiWrite('plano_terapeutico?id=eq.'+encodeURIComponent(c.id), 'PATCH', {
            atividade: c.atividade || null, feito: c.feito, atualizado_por: f.nome, atualizado_em: agora
          });
        }else if(c.atividade || c.feito){
          await apiWrite('plano_terapeutico', 'POST', {
            morador_id: moradorId, morador_nome: moradorNome, dia_semana: dia, periodo,
            atividade: c.atividade || null, feito: c.feito, atualizado_por: f.nome, atualizado_em: agora
          });
        }
      }
      location.hash = 'morador-' + moradorId;
    }catch(e){
      msg.textContent = '⚠️ Erro: ' + esc(e.message) + '.';
      if(btn) btn.disabled = false;
    }
  }

  // ---------- REFERÊNCIA: INFECÇÕES HOSPITALARES ----------
  const REFERENCIA_INFECCOES = [
    {periodo:'Idade Média — Início do capitalismo (Séc. XVII)', acao:'Expectante — recolhimento e alojamento de indigentes e enfermos', tipo:'Exógenas específicas — causadas por microrganismos não pertencentes à flora humana normal, com quadro clínico específico, tipo doenças comunitárias (ex.: B. Koch — tuberculose; Vibrião colérico — cólera)', transmissao:'Vias aéreas superiores e por veículos (água, solo, mãos etc.)'},
    {periodo:'Século XVIII até início do Séc. XX', acao:'Intervenção no corpo, com procedimentos invasivos, sem recursos de assepsia e antimicrobianos', tipo:'Exógenas e endógenas inespecíficas — causadas por microrganismos da flora humana ou não, a partir das condições de invasão/reprodução no organismo, apresentando infecções em vários "sítios" (ex.: urinárias, respiratórias, de ferida cirúrgica)', transmissao:'Predominantemente por veiculação, através de procedimentos invasivos (mãos e instrumentais) e migração da flora humana pra áreas estéreis'},
    {periodo:'Meados do Séc. XX', acao:'Intervenções no corpo com recursos de assepsia e medicamentos antimicrobianos/imunodepressivos', tipo:'Endógenas inespecíficas multirresistentes — causadas por microrganismos da flora humana, com resistência alterada aos antimicrobianos', transmissao:'Pelo ambiente (liberação da flora cutâneo-mucosa), por veiculação e migração'}
  ];

  function telaReferenciaInfeccoes(){
    app.innerHTML = `
      <div class="topo" style="background:linear-gradient(120deg,${SETORES.enfermagem.grad[0]},${SETORES.enfermagem.grad[1]})">
        <button class="voltar" onclick="location.hash='enfermagem'">← Voltar</button>
        <h1>📖 Infecções Hospitalares</h1>
        <p>Formas de manifestação na evolução da assistência hospitalar</p>
      </div>
      <div class="wrap">
        ${REFERENCIA_INFECCOES.map(r => `
          <div style="border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:14px">
            <div style="font-weight:700;color:var(--teal-esc);font-size:14px;margin-bottom:8px">🕰️ ${esc(r.periodo)}</div>
            <div style="font-size:13px;margin-bottom:6px"><b>Ação assistencial:</b> ${esc(r.acao)}</div>
            <div style="font-size:13px;margin-bottom:6px"><b>Tipo de infecção predominante:</b> ${esc(r.tipo)}</div>
            <div style="font-size:13px"><b>Modo de transmissão:</b> ${esc(r.transmissao)}</div>
          </div>
        `).join('')}
      </div>
      <div class="rodape">Village Viver Bem · Residencial Care · Material de referência</div>
    `;
  }

  // ---------- ROTEADOR ----------
  let viewToken = 0;
  function apósPrefixo(hash, prefixo){
    return hash.indexOf(prefixo) === 0 ? hash.slice(prefixo.length) : null;
  }
  function router(){
    viewToken++;
    const rawHash = location.hash.replace('#','') || 'inicio';
    const hash = rawHash.split('?')[0];
    let m;
    if(hash === 'inicio') telaInicio();
    else if(hash === 'estoque') telaEstoque();
    else if(hash === 'moradores') telaMoradores();
    else if((m = apósPrefixo(hash, 'leitor-')) !== null) telaLeitor(m);
    else if((m = apósPrefixo(hash, 'estoque-baixo-')) !== null) telaEstoqueBaixoSetor(m);
    else if((m = apósPrefixo(hash, 'externo-')) !== null) { if(EXTERNOS[m]) irExterno(m, EXTERNOS[m]); else telaInicio(); }
    else if(hash === 'funcionarios') telaFuncionarios();
    else if(hash === 'funcionarios-novo') telaFuncionarioNovo();
    else if((m = apósPrefixo(hash, 'funcionarios-editar-')) !== null) telaFuncionarioEditar(m);
    else if((m = apósPrefixo(hash, 'editar-katz-')) !== null) telaKatz(m, true);
    else if((m = apósPrefixo(hash, 'registrar-agua-')) !== null) telaRegistrarSimples('agua', m);
    else if((m = apósPrefixo(hash, 'registrar-fralda-')) !== null) telaRegistrarSimples('fralda', m);
    else if((m = apósPrefixo(hash, 'registrar-higiene-')) !== null) telaRegistrarSimples('higiene', m);
    else if((m = apósPrefixo(hash, 'registrar-decubito-')) !== null) telaRegistrarSimples('decubito', m);
    else if((m = apósPrefixo(hash, 'registrar-curativo-')) !== null) telaRegistrarSimples('curativo', m);
    else if((m = apósPrefixo(hash, 'registrar-evacuacao-')) !== null) telaRegistrarSimples('evacuacao', m);
    else if((m = apósPrefixo(hash, 'registrar-diurese-')) !== null) telaRegistrarSimples('diurese', m);
    else if((m = apósPrefixo(hash, 'registrar-mobilidade-')) !== null) telaRegistrarSimples('mobilidade', m);
    else if((m = apósPrefixo(hash, 'registrar-pele-')) !== null) telaRegistrarSimples('pele', m);
    else if((m = apósPrefixo(hash, 'registrar-comportamento-')) !== null) telaRegistrarSimples('comportamento', m);
    else if((m = apósPrefixo(hash, 'registrar-dor-')) !== null) telaRegistrarSimples('dor', m);
    else if((m = apósPrefixo(hash, 'registrar-alimentacao-')) !== null) telaRegistrarAlimentacao(m);
    else if((m = apósPrefixo(hash, 'anotacao-')) !== null) telaAnotacao(m);
    else if((m = apósPrefixo(hash, 'vitais-')) !== null) telaVitais(m);
    else if((m = apósPrefixo(hash, 'evolucao-')) !== null) telaEvolucao(m);
    else if((m = apósPrefixo(hash, 'katz-')) !== null) telaKatz(m);
    else if((m = apósPrefixo(hash, 'editar-lawton-')) !== null) telaLawton(m, true);
    else if((m = apósPrefixo(hash, 'lawton-')) !== null) telaLawton(m);
    else if((m = apósPrefixo(hash, 'sae-')) !== null) telaSAE(m);
    else if((m = apósPrefixo(hash, 'plano-')) !== null) telaPlanoTerapeutico(m);
    else if(hash === 'referencia-infeccoes') telaReferenciaInfeccoes();
    else if(hash === 'morador-novo') telaMoradorNovo();
    else if((m = apósPrefixo(hash, 'morador-editar-')) !== null) telaMoradorEditar(m);
    else if((m = apósPrefixo(hash, 'medicacoes-')) !== null) telaMedicacoes(m);
    else if((m = apósPrefixo(hash, 'relatorio-')) !== null) telaRelatorioMorador(m);
    else if((m = apósPrefixo(hash, 'nova-prescricao-')) !== null) telaNovaPrescricao(m);
    else if((m = apósPrefixo(hash, 'administrar-')) !== null) telaAdministrarMedicamento(m);
    else if((m = apósPrefixo(hash, 'registrar-intercorrencia-')) !== null) telaRegistrarIntercorrencia(m);
    else if(hash === 'intercorrencias') telaIntercorrencias();
    else if((m = apósPrefixo(hash, 'morador-')) !== null) telaMoradorFicha(m);
    else if(SETORES[hash]) { if(garantirAcessoSetor(hash)) telaSetor(hash); }
    else telaInicio();
    atualizarSidebarAtiva(hash);
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', router);
  router();
  atualizarBadgesSidebar();
</script>
</body>
</html>
